<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Genes in a region</title>
</head>
<body style="background-color: violet">
  <h1>ALL THE GENES THAT ARE PRESENT IN A CHROMOSOME REGION</h1>
  <p>Selected chromosome: {{changes.chr}}</p>
  <p>Selected region: from {{changes.start}} to {{changes.end}}</p>
  <p>Genes found:</p>
  <ul>
  {% for gene in changes.gene_names %}
    <li>{{gene}}</li>
  {% endfor %}
  </ul>

  <hr>
  <a href="http://127.0.0.1:8080/">Main Page</a>

</body>
</html>
