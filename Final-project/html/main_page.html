<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main page</title>
</head>
<body style="background-color: lightpink">
  <h1>BROWSING HUMAN AND VERTEBRATES GENOME</h1>
  <h2>BASIC level services</h2>
  <form action="listSpecies" method="get">
    1)List of species in the database
    <br>
    Limit:
    <input type="text" name="limitval">
    <br>
    <input type="submit" value="SEND">
  </form>
  <hr>
  <form action="karyotype" method="get">
    2)Information about the karyotype:
    <br>
    Select the species:
    <input type="text" name="specie">
    <br>
    <input type="submit" value="SEND">
  </form>
  <hr>
  <form action="chromosomeLength" method="get">
    3)Chromosome Length
    <br>
    Select the species:
    <input type="text" name="specie_ch">
    <br>
    Select a chromosome:
    <input type="text" name="n_ch">
    <br>
    <input type="submit" value="SEND">
  </form>
</body>
</html>
